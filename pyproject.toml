[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-triage"
version = "0.2.0a9"
description = "Read-only field-triage inventory for removable media"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "reportlab>=4.2"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
forensic-triage = "forensic_triage.cli:main"
forensic-triage-web = "forensic_triage.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
