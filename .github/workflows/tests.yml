name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run automated tests
        run: python -m pytest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.63.0
      - name: Install Chromium for offline UI tests
        run: npx playwright install --with-deps chromium
      - name: Run synthetic browser regressions
        run: node --test tests/test_web_ui.cjs
